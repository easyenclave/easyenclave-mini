name: Cleanup Azure smoke orphans

# Backstop sweep for ee-smoke-* resources left behind by
# build-and-smoke (azure) runs. The smoke script's own trap cleanup
# handles the happy path; this workflow covers the pathological cases
# (runner hard-kill, cleanup exception, future naming-drift) before
# they pile up against the WestUS3 Regional Cores quota.
#
# Safe to run any time: the 30-minute age threshold is past the
# normal smoke budget, so an in-flight job's resources won't be swept
# out from under it.

on:
  schedule:
    # Hourly: the smoke script does preflight cleanup, but this keeps
    # quota clear even if no follow-up smoke job starts after a runner
    # hard-kill or cancellation.
    - cron: '0 * * * *'
  workflow_dispatch:

# Serialize: if cron + a manual dispatch collide, one waits.
concurrency:
  group: cleanup-azure-smoke
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sweep stale ee-smoke-* resources
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCT: ${{ secrets.AZURE_STORAGE_ACCT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          AZURE_GALLERY: ${{ secrets.AZURE_GALLERY }}
          AZURE_IMG_DEF: ${{ secrets.AZURE_IMG_DEF }}
        run: |
          set -euo pipefail
          smoke_prefix="${AZURE_SMOKE_PREFIX:-ee-smoke-}"
          stale_after_seconds="${AZURE_SMOKE_STALE_AFTER_SECONDS:-1800}"
          gallery_name="${AZURE_GALLERY:-easyenclaveGallery}"
          image_def_name="${AZURE_IMG_DEF:-easyenclave-mini-x64}"
          storage_acct="${AZURE_STORAGE_ACCT:-eeci$(echo -n "${AZURE_RESOURCE_GROUP}" | sha256sum | cut -c1-16)}"
          storage_container="${AZURE_STORAGE_CONTAINER:-vhds}"
          threshold=$(( $(date +%s) - stale_after_seconds ))
          echo "cleanup: threshold=$threshold ($(date -u -d @$threshold '+%Y-%m-%dT%H:%MZ'))"

          run_stamp_from_name() {
            local name="$1"
            local rest sha stamp suffix
            rest="${name#"$smoke_prefix"}"
            IFS=- read -r sha stamp suffix <<< "$rest"
            case "$stamp" in
              ''|*[!0-9]*) return 1 ;;
            esac
            printf '%s\n' "$stamp"
          }

          stale_run_prefixes() {
            local name stamp rest sha
            az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
                --query "[?starts_with(name, '${smoke_prefix}')].name" -o tsv \
              | while IFS= read -r name; do
                  stamp="$(run_stamp_from_name "$name" || true)"
                  [ -n "$stamp" ] || continue
                  [ "$stamp" -lt "$threshold" ] || continue
                  rest="${name#"$smoke_prefix"}"
                  sha="${rest%%-*}"
                  printf '%s%s-%s\n' "$smoke_prefix" "$sha" "$stamp"
                done | sort -u
          }

          delete_run_resources() {
            local run_prefix="$1"
            local vm_names vm ids id pass
            echo "cleanup: deleting resources for ${run_prefix}-*"

            vm_names=$(az vm list --resource-group "$AZURE_RESOURCE_GROUP" \
                --query "[?starts_with(name, '${run_prefix}')].name" -o tsv || true)
            while IFS= read -r vm; do
              [ -n "$vm" ] || continue
              echo "cleanup: delete vm $vm"
              az vm delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$vm" --yes || true
            done <<< "$vm_names"

            for pass in 1 2 3; do
              ids=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
                  --query "[?starts_with(name, '${run_prefix}')].id" -o tsv || true)
              [ -n "$ids" ] || return 0
              echo "cleanup: generic sweep pass $pass for ${run_prefix}-*"
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                az resource delete --ids "$id" --verbose || true
              done <<< "$ids"
              sleep 10
            done
          }

          prune_image_versions() {
            local versions version stamp
            if ! az sig image-definition show --resource-group "$AZURE_RESOURCE_GROUP" \
                --gallery-name "$gallery_name" --gallery-image-definition "$image_def_name" >/dev/null 2>&1; then
              return 0
            fi
            versions=$(az sig image-version list --resource-group "$AZURE_RESOURCE_GROUP" \
                --gallery-name "$gallery_name" --gallery-image-definition "$image_def_name" \
                --query "[].name" -o tsv || true)
            while IFS= read -r version; do
              [ -n "$version" ] || continue
              stamp="${version##*.}"
              case "$stamp" in
                ''|*[!0-9]*) continue ;;
              esac
              [ "$stamp" -lt "$threshold" ] || continue
              echo "cleanup: delete stale image version $version"
              az sig image-version delete --resource-group "$AZURE_RESOURCE_GROUP" \
                  --gallery-name "$gallery_name" --gallery-image-definition "$image_def_name" \
                  --gallery-image-version "$version" --no-wait || true
            done <<< "$versions"
          }

          prune_blobs() {
            local acct_key blobs blob stamp
            acct_key=$(az storage account keys list --resource-group "$AZURE_RESOURCE_GROUP" \
                --account-name "$storage_acct" --query '[0].value' -o tsv 2>/dev/null || true)
            [ -n "$acct_key" ] || return 0
            blobs=$(az storage blob list --account-name "$storage_acct" \
                --container-name "$storage_container" --account-key "$acct_key" \
                --query "[?starts_with(name, '${smoke_prefix}')].name" -o tsv || true)
            while IFS= read -r blob; do
              [ -n "$blob" ] || continue
              stamp="$(run_stamp_from_name "$blob" || true)"
              [ -n "$stamp" ] || continue
              [ "$stamp" -lt "$threshold" ] || continue
              echo "cleanup: delete stale blob $blob"
              az storage blob delete --account-name "$storage_acct" \
                  --container-name "$storage_container" --name "$blob" \
                  --account-key "$acct_key" || true
            done <<< "$blobs"
          }

          stale_prefixes="$(stale_run_prefixes || true)"
          if [ -z "$stale_prefixes" ]; then
            echo "cleanup: no stale ${smoke_prefix}* resource prefixes"
          else
            while IFS= read -r stale_prefix; do
              [ -n "$stale_prefix" ] || continue
              delete_run_resources "$stale_prefix"
            done <<< "$stale_prefixes"
          fi
          prune_image_versions
          prune_blobs
