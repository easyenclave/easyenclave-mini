name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "image/init/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: easyenclave-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --workspace covers both easyenclave (rootfs PID 1 + sh/httpd applets)
      # and ee-init (initramfs). The env-merge contract tests that used to run
      # under `busybox sh` now live in ee-init's `env` module (cargo test).
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
