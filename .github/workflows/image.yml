name: Build & Release VM Image

# Build every target, spin up a real TDX VM per target, run an end-to-end
# enclave test, then publish the gcp image family + all artifacts.
#
# Pipeline:
#   meta ── build-and-smoke (matrix) ──┬── gcp-promote (non-PR only)
#                                       └── release     (non-PR only, gates on all above)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "image/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "image/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: easyenclave-mini-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Shared metadata (sha12, tag, release name, gcp image name) ──────
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha12: ${{ steps.s.outputs.sha12 }}
      tag: ${{ steps.s.outputs.tag }}
      release_name: ${{ steps.s.outputs.release_name }}
      gcp_name: ${{ steps.s.outputs.gcp_name }}
    steps:
      - id: s
        run: |
          SHA12=$(echo "${{ github.sha }}" | cut -c1-12)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            GCP_NAME="easyenclave-mini-${TAG//./-}"
            RELEASE_NAME="easyenclave-mini-${TAG}"
          else
            TAG=""
            GCP_NAME="easyenclave-mini-${SHA12}"
            RELEASE_NAME="easyenclave-mini-${SHA12}"
          fi
          {
            echo "sha12=${SHA12}"
            echo "tag=${TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "gcp_name=${GCP_NAME}"
          } >> "$GITHUB_OUTPUT"

  # ── Build + real-TDX smoke, combined per target ─────────────────────
  # One job per target: builds the image, uploads the artifact, then
  # spins up a real TDX VM on that target's platform and runs the
  # enclave through boot + attestation + workload-serve.
  #
  # Smoke is skipped on fork PRs (would burn cloud $ / expose the local
  # TDX SSH key). Build still runs on forks so they get at least a
  # compile-level signal. Build artifacts always upload before smoke
  # so a smoke failure is debuggable from the artifact.
  build-and-smoke:
    needs: meta
    name: build-and-smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # gcp              : GPT disk + GCE import tar.gz, cloud TDX CVM
        # azure            : GPT disk + fixed-size VHD, Azure TDX CVM via SIG
        # local-tdx-qcow2  : GPT-disk qcow2, libvirt backing-file shape
        #                    (`devopsdefender/dd`), boots on EE_LOCAL_HOST under
        #                    real OVMF.inteltdx.fd
        include:
          - target: gcp
            kernel_meta: linux-image-gcp
            kernel_flavor: gcp
          - target: azure
            kernel_meta: linux-image-azure
            kernel_flavor: azure
          - target: local-tdx-qcow2
            kernel_meta: linux-image-generic
            kernel_flavor: generic
    steps:
      - uses: actions/checkout@v4

      # ── Build phase ─────────────────────────────────────────────────
      - name: Install apt build dependencies
        id: deps
        timeout-minutes: 10
        env:
          KERNEL_META: ${{ matrix.kernel_meta }}
          KERNEL_FLAVOR: ${{ matrix.kernel_flavor }}
        run: bash image/ci-install-build-deps.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkosi v26
        run: |
          pip install 'git+https://github.com/systemd/mkosi.git@v26' pefile
          sudo ln -sf "$(which mkosi)" /usr/local/bin/mkosi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (TARGET=${{ matrix.target }})
        env:
          KVER: ${{ steps.deps.outputs.kver }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release
          cd image && make build KVER="$KVER" TARGET="$TARGET"

      - name: Rename + compute measurements
        env:
          TARGET: ${{ matrix.target }}
          SHA12: ${{ needs.meta.outputs.sha12 }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash image/ci-stage-artifacts.sh

      - uses: actions/upload-artifact@v4
        with:
          name: easyenclave-mini-image-${{ matrix.target }}
          path: |
            image/output/${{ matrix.target }}/easyenclave-mini-*
            image/output/${{ matrix.target }}/MEASUREMENTS.txt
          retention-days: 7

      # ── Smoke phase (per-target auth + tools + real TDX test) ───────
      # Gated on fork check so fork PRs don't burn cloud $ / expose
      # the local TDX SSH key. Fork PRs still get the build above.
      - id: smoke
        name: Check smoke configuration
        env:
          TARGET: ${{ matrix.target }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          EE_LOCAL_HOST: ${{ secrets.EE_LOCAL_HOST }}
          EE_LOCAL_USER: ${{ vars.EE_LOCAL_USER }}
          EE_LOCAL_REPO: ${{ vars.EE_LOCAL_REPO }}
          EE_LOCAL_SSH_KEY: ${{ secrets.EE_LOCAL_SSH_KEY }}
        run: |
          enabled=false
          reason=""
          case "$TARGET" in
            azure)
              if [ -n "$AZURE_CREDENTIALS" ] && [ -n "$AZURE_RESOURCE_GROUP" ]; then
                enabled=true
              else
                reason="missing AZURE_CREDENTIALS and/or AZURE_RESOURCE_GROUP"
              fi
              ;;
            gcp)
              if [ -n "$GCP_PROJECT" ] && [ -n "$GCS_BUCKET" ]; then
                enabled=true
              else
                reason="missing GCP_PROJECT_ID and/or GCS_BUCKET"
              fi
              ;;
            local-tdx-qcow2)
              if [ -n "$EE_LOCAL_HOST" ] && [ -n "$EE_LOCAL_USER" ] && [ -n "$EE_LOCAL_SSH_KEY" ]; then
                enabled=true
              else
                reason="missing EE_LOCAL_HOST, EE_LOCAL_USER, and/or EE_LOCAL_SSH_KEY"
              fi
              ;;
            *)
              reason="unknown target"
              ;;
          esac
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != true ]; then
            echo "::warning::Skipping ${TARGET} smoke: ${reason}"
          fi

      - if: >-
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
             && matrix.target == 'gcp'
             && steps.smoke.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/779946350556/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'easyenclave-github-provisioner@easyenclave.iam.gserviceaccount.com'
      - if: >-
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
             && matrix.target == 'gcp'
             && steps.smoke.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: >-
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
             && matrix.target == 'azure'
             && steps.smoke.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - if: >-
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
             && matrix.target == 'azure'
             && steps.smoke.outputs.enabled == 'true'
        name: Install AzCopy
        run: |
          curl -fsSL https://aka.ms/downloadazcopy-v10-linux | tar -xz
          sudo mv azcopy_linux_amd64_*/azcopy /usr/local/bin/
          azcopy --version

      - if: >-
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
             && matrix.target == 'local-tdx-qcow2'
             && steps.smoke.outputs.enabled == 'true'
        name: Stage SSH key for local TDX host
        env:
          EE_LOCAL_SSH_KEY: ${{ secrets.EE_LOCAL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EE_LOCAL_SSH_KEY" > ~/.ssh/easyenclave_local_tdx_key
          chmod 600 ~/.ssh/easyenclave_local_tdx_key
          echo "EE_LOCAL_SSH_KEY_PATH=$HOME/.ssh/easyenclave_local_tdx_key" >> "$GITHUB_ENV"

      - if: >-
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
             && steps.smoke.outputs.enabled == 'true'
        name: Real-TDX smoke (${{ matrix.target }})
        env:
          SHA12: ${{ needs.meta.outputs.sha12 }}
          GITHUB_SHA: ${{ github.sha }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          EE_LOCAL_HOST: ${{ secrets.EE_LOCAL_HOST }}
          EE_LOCAL_USER: ${{ vars.EE_LOCAL_USER }}
          EE_LOCAL_REPO: ${{ vars.EE_LOCAL_REPO }}
          EE_LOCAL_REPO_URL: ${{ vars.EE_LOCAL_REPO_URL }}
        run: bash image/ci-tdx-smoke-${{ matrix.target }}.sh

  # ── GCP image promotion (publishes staging / stable family) ─────────
  # Runs after build-and-smoke's gcp matrix entry passes. Publishes the
  # image under a channel label (staging on main, stable on tags) and
  # rotates old images. Skipped entirely on PRs.
  gcp-promote:
    needs: [meta, build-and-smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: promote
        name: Check GCP promotion configuration
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          enabled=false
          reason=""
          if [ -n "$GCP_PROJECT" ] && [ -n "$GCS_BUCKET" ]; then
            enabled=true
          else
            reason="missing GCP_PROJECT_ID and/or GCS_BUCKET"
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != true ]; then
            echo "::warning::Skipping GCP promotion: ${reason}"
          fi
      - if: steps.promote.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/779946350556/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'easyenclave-github-provisioner@easyenclave.iam.gserviceaccount.com'
      - if: steps.promote.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - uses: actions/download-artifact@v4
        with:
          name: easyenclave-mini-image-gcp
          path: image/output/gcp

      - if: steps.promote.outputs.enabled == 'true'
        name: Upload + create promoted image
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          SHA12: ${{ needs.meta.outputs.sha12 }}
          GCP_NAME: ${{ needs.meta.outputs.gcp_name }}
        run: |
          ASSET="easyenclave-mini-${SHA12}-gcp.tar.gz"
          gcloud storage cp "image/output/gcp/${ASSET}" \
            "gs://${GCS_BUCKET}/${ASSET}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            FAMILY="--family=easyenclave-mini-stable"
            CHANNEL="stable"
          else
            FAMILY="--family=easyenclave-mini-staging"
            CHANNEL="staging"
          fi

          gcloud compute images create "${GCP_NAME}" \
            --project="${GCP_PROJECT}" \
            --source-uri="gs://${GCS_BUCKET}/${ASSET}" \
            ${FAMILY} \
            --guest-os-features=UEFI_COMPATIBLE,TDX_CAPABLE,GVNIC \
            --labels=easyenclave-mini=image,channel=${CHANNEL},commit=${SHA12}

      - if: steps.promote.outputs.enabled == 'true'
        name: Rotate old promoted images
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud compute images list --project="${GCP_PROJECT}" \
            --filter="labels.easyenclave-mini=image AND labels.channel=staging" \
            --format="value(name)" --sort-by="~creationTimestamp" \
            | tail -n +6 \
            | xargs -rI{} gcloud compute images delete {} \
                --project="${GCP_PROJECT}" --quiet

  # ── Release (non-PR only) ───────────────────────────────────────────
  release:
    needs: [meta, build-and-smoke, gcp-promote]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-stage
          pattern: easyenclave-mini-image-*

      - name: Stage release assets
        env:
          SHA12: ${{ needs.meta.outputs.sha12 }}
        run: |
          mkdir -p release-out
          cd release-stage
          for target_dir in easyenclave-mini-image-*; do
            target="${target_dir#easyenclave-mini-image-}"
            for f in "${target_dir}"/easyenclave-mini-*; do
              [ -f "$f" ] || continue
              cp "$f" ../release-out/
            done
            if [ -f "${target_dir}/MEASUREMENTS.txt" ]; then
              cp "${target_dir}/MEASUREMENTS.txt" "../release-out/MEASUREMENTS-${target}.txt"
            fi
          done
          cd ..
          ls -la release-out/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA12: ${{ needs.meta.outputs.sha12 }}
          TAG: ${{ needs.meta.outputs.tag }}
          GCP_NAME: ${{ needs.meta.outputs.gcp_name }}
        run: |
          if [ -n "$TAG" ]; then
            GH_TAG="$TAG"
            PRERELEASE=""
          else
            GH_TAG="mini-image-${SHA12}"
            PRERELEASE="--prerelease"
          fi

          NOTES_FILE=$(mktemp)
          {
            echo "## Artifacts by target"
            echo ""
            echo "- **gcp** — raw, qcow2, gcp-tar.gz (GCE import)"
            echo "- **azure** — raw, vhd (fixed-size, Azure Managed Disk import)"
            echo "- **local-tdx-qcow2** — raw, qcow2 (libvirt backing file for dd-style deployments)"
            echo ""
            echo "GCP image: \`${GCP_NAME}\`"
            echo ""
            for m in release-out/MEASUREMENTS-*.txt; do
              [ -f "$m" ] || continue
              target=$(basename "$m" .txt | sed 's/^MEASUREMENTS-//')
              echo "### MEASUREMENTS (${target})"
              echo ""
              echo '```'
              cat "$m"
              echo '```'
              echo ""
            done
          } > "$NOTES_FILE"

          gh release create "${GH_TAG}" ${PRERELEASE} \
            --title "${GH_TAG}" \
            --notes-file "${NOTES_FILE}" \
            release-out/*
