[workspace]
# `easyenclave` (this package, rootfs PID 1) + `ee-init` (the static-musl
# initramfs PID 1 that replaces the old busybox/shell initrd). Two crates so
# `ee-init` gets a tiny, tokio-free dependency graph and its own build target.
members = ["image/init"]
resolver = "2"

# Size-tuned profile for the initramfs binary only — selected explicitly with
# `cargo build -p ee-init --profile release-min`. Cargo profiles are
# workspace-global, so we use a custom profile here rather than mutating
# [profile.release] (which would force panic=abort onto the main runtime, where
# a panicking task must not abort PID 1).
[profile.release-min]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "easyenclave"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Generic enclave runtime. Runs as PID 1 in a sealed TDX VM. Unix socket API."

[[bin]]
name = "easyenclave"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# flate2 + tar: extracting .tar.gz release assets from GitHub.
flate2 = "1"
tar = "0.4"
libc = "0.2"
# nix: openpty for tty workloads + attach sessions (replaces the busybox
# `script` shell-out). `term` gates the pty module.
nix = { version = "0.29", features = ["term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time", "fs", "net", "io-util", "sync"] }
# ureq: sync HTTP client for the GitHub Releases API (HTTPS, needs TLS).
# `tls` pulls rustls + webpki-roots; we don't depend on system CA certs.
# Cloud-metadata fetches live in the initrd vendor stage (busybox wget),
# not in this binary.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
